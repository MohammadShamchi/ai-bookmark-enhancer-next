<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Bookmark Enhancer — Settings</title>
<style>
  :root {
    --bg: #0E1013;
    --surface: #16181C;
    --border: rgba(255,255,255,0.05);
    --accent: #5FE0C1;
    --accent-dim: #3BB39A;
    --text-primary: #ECEDEE;
    --text-secondary: #A4A6A8;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 32px 20px;
    opacity: 0;
    transition: opacity .25s ease;
  }
  body.page-ready { opacity: 1; }
  body.page-exit { opacity: 0; }

  .panel {
    width: 100%;
    max-width: 580px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 12px 36px rgba(0,0,0,0.4);
    padding: 40px 48px 48px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .header { text-align: center; }
  .title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: var(--text-secondary); }
  .top-bar {
    display: flex;
    justify-content: flex-start;
  }
  .back-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .back-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(95,224,193,0.05);
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .input-wrapper {
    position: relative;
  }
  input[type="password"],
  input[type="text"] {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 14px;
    padding: 12px 16px;
    transition: border-color .15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .toggle-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
  }
  .toggle-btn:hover {
    color: var(--text-primary);
  }

  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    padding: 11px 22px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .btn-primary {
    background: var(--accent);
    color: #0E1013;
    flex: 1;
  }
  .btn-primary:hover {
    background: var(--accent-dim);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(95,224,193,0.25);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
    flex: 1;
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text-primary);
  }

  .status {
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 12px;
    text-align: center;
    display: none;
  }
  .status.info {
    display: block;
    background: rgba(95,224,193,0.08);
    border: 1px solid rgba(95,224,193,0.15);
    color: var(--accent);
  }
  .status.success {
    display: block;
    background: rgba(95,224,193,0.1);
    border: 1px solid rgba(95,224,193,0.3);
    color: var(--accent);
  }
  .status.error {
    display: block;
    background: rgba(255,80,80,0.1);
    border: 1px solid rgba(255,80,80,0.3);
    color: #ff6b6b;
  }

  .developer-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .developer-card h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .toggle-row label {
    color: var(--text-primary);
    font-weight: 500;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(255,255,255,0.15);
    transition: .2s;
    border-radius: 999px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: #0E1013;
    transition: .2s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: rgba(95,224,193,0.7);
  }
  input:checked + .slider:before {
    transform: translateX(18px);
  }
  .dev-status {
    font-size: 13px;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 10px 12px;
    display: none;
  }
  .dev-status.visible {
    display: block;
  }

  .footer-tip {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-secondary);
    opacity: 0.6;
    margin-top: 8px;
  }
  .toast{
    position:fixed;
    bottom:28px;
    right:28px;
    background:rgba(22,24,28,0.95);
    color:var(--text-primary);
    padding:10px 16px;
    border-radius:999px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .2s ease,transform .2s ease;
    border:1px solid rgba(255,255,255,0.08);
    font-size:13px;
  }
  .toast.show{
    opacity:1;
    transform:translateY(0);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="top-bar">
      <button class="back-btn" id="backBtn">← Back</button>
    </div>
    <div class="header">
      <div class="title">Settings</div>
      <div class="subtitle">Configure your OpenAI API key</div>
    </div>

    <div class="form-group">
      <label for="apiKey">OpenAI API Key</label>
      <div class="input-wrapper">
        <input type="password" id="apiKey" placeholder="sk-...">
        <button class="toggle-btn" id="toggleVisibility" type="button">Show</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="saveBtn">Save Key</button>
      <button class="btn-secondary" id="testBtn">Test Connection</button>
    </div>

    <div class="status" id="status"></div>

    <div class="developer-card">
      <h3>Developer tools</h3>
      <div class="toggle-row">
        <label for="fast-mode-toggle">Fast mode</label>
        <label class="switch">
          <input type="checkbox" id="fast-mode-toggle">
          <span class="slider"></span>
        </label>
      </div>
      <div id="fast-mode-label" style="font-size:13px;color:var(--text-secondary);"></div>
      <button class="btn-secondary" id="status-btn">Request current status</button>
      <div class="dev-status" id="dev-status"></div>
    </div>

    <div class="footer-tip">Your API key is stored locally and never shared.</div>
  </div>

<script type="module" src="./settings.js"></script>
</body>
</html>
